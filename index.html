<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelArt - 프리미엄 디지털 아트 마켓플레이스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
        html { scroll-behavior: smooth; }
        .gradient-text { background: linear-gradient(135deg, #ec4899 0%, #f97316 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 0, 0, 0.05); }
        .hover-scale { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .hover-scale:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(236, 72, 153, 0.2); }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
        .float-animation { animation: float 4s ease-in-out infinite; }
        .gradient-bg { background: linear-gradient(135deg, #fef3f2 0%, #fff1f2 50%, #fce7f3 100%); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .like-btn { position: absolute; top: 15px; right: 15px; z-index: 10; background: white; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: all 0.2s; border: none; font-size: 1.2rem; }
        .like-btn.liked { color: #ec4899; }
    </style>
</head>
<body class="gradient-bg text-gray-900">
    
    <nav class="fixed w-full z-50 glass-effect">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="text-2xl font-black gradient-text cursor-pointer" onclick="goToHome()">PixelArt</div>
            
            <div id="authButtons" class="flex items-center gap-2">
                <button onclick="openLoginModal()" class="text-gray-600 font-bold px-4 py-2 hover:text-pink-500 transition">로그인</button>
                <button onclick="openSignupModal()" class="bg-gradient-to-r from-pink-500 to-orange-500 text-white px-5 py-2 rounded-full font-bold shadow-md hover:shadow-lg transition">회원가입</button>
            </div>

            <div id="userMenu" class="hidden flex items-center gap-4">
                <button onclick="showMyPage()" class="text-gray-700 font-bold hover:text-pink-500 transition border-b-2 border-transparent hover:border-pink-500">마이페이지</button>
                <span id="userNameDisplay" class="font-bold text-pink-600 hidden md:inline"></span>
                <button onclick="logout()" class="text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded-lg transition">로그아웃</button>
            </div>
        </div>
    </nav>

    <section id="hero" class="pt-40 pb-24 px-4 text-center relative overflow-hidden">
        <div class="absolute top-10 left-1/4 w-72 h-72 bg-pink-200 rounded-full blur-3xl opacity-40 float-animation"></div>
        <div class="relative z-10">
            <h1 class="text-5xl md:text-8xl font-black mb-8 leading-tight">디지털 아트의<br><span class="gradient-text">새로운 기준</span></h1>
            <p class="text-xl md:text-2xl text-gray-600 mb-12 max-w-2xl mx-auto">지금 회원가입하고 나만의 아트 컬렉션을 완성하세요.</p>
            
            <div id="heroButtons" class="flex flex-col sm:flex-row justify-center gap-4">
                <button onclick="location.href='#gallery'" class="bg-gray-900 text-white px-10 py-4 rounded-full text-lg font-bold hover:bg-black transition shadow-xl">갤러리 둘러보기</button>
                <button id="heroSignupBtn" onclick="openSignupModal()" class="bg-white text-pink-500 border-2 border-pink-500 px-10 py-4 rounded-full text-lg font-bold hover:bg-pink-50 transition">무료 회원가입</button>
            </div>
        </div>
    </section>

    <section id="gallery" class="py-24 bg-white">
        <div class="max-w-7xl mx-auto px-4">
            <h2 class="text-4xl font-black text-center mb-12">프리미엄 갤러리</h2>
            
            <div class="flex justify-center gap-3 mb-10 flex-wrap">
                <button onclick="filterGallery('all', this)" class="filter-btn active px-8 py-2 rounded-full bg-pink-500 text-white font-bold shadow-md">전체</button>
                <button onclick="filterGallery('wallpaper', this)" class="filter-btn px-8 py-2 rounded-full bg-gray-100 hover:bg-gray-200 font-bold transition">배경화면</button>
                <button onclick="filterGallery('illustration', this)" class="filter-btn px-8 py-2 rounded-full bg-gray-100 hover:bg-gray-200 font-bold transition">일러스트</button>
                <button onclick="filterGallery('photo', this)" class="filter-btn px-8 py-2 rounded-full bg-gray-100 hover:bg-gray-200 font-bold transition">사진</button>
            </div>

            <div class="max-w-md mx-auto mb-16">
                <input type="text" id="searchInput" onkeyup="searchGallery()" placeholder="이미지 제목으로 검색..." class="w-full px-6 py-4 rounded-full border-2 border-gray-100 focus:border-pink-500 outline-none shadow-sm transition-all">
            </div>

            <div id="galleryGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                </div>
        </div>
    </section>

    <section id="mypage" class="py-24 px-4 hidden">
        <div class="max-w-5xl mx-auto bg-white rounded-[2rem] p-12 shadow-2xl border border-gray-50">
            <div class="flex justify-between items-center mb-12">
                <h2 class="text-4xl font-black">마이페이지</h2>
                <button onclick="goToHome()" class="text-pink-500 font-bold">← 돌아가기</button>
            </div>
            <div class="grid md:grid-cols-3 gap-12">
                <div class="md:col-span-1 space-y-6">
                    <div class="bg-pink-50 p-6 rounded-2xl">
                        <p class="text-sm text-pink-400 font-bold mb-1 uppercase">User Profile</p>
                        <p class="text-xl font-black text-gray-800" id="mpName"></p>
                        <p class="text-gray-500 text-sm" id="mpEmail"></p>
                    </div>
                </div>
                <div class="md:col-span-2">
                    <h3 class="text-xl font-black mb-6 flex items-center gap-2">내가 찜한 아트워크 ❤️</h3>
                    <div id="likedList" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                        </div>
                </div>
            </div>
        </div>
    </section>

    <div id="loginModal" class="modal">
        <div class="bg-white p-10 rounded-3xl w-full max-w-sm relative shadow-2xl">
            <button onclick="closeLoginModal()" class="absolute top-6 right-6 text-gray-400 hover:text-black text-3xl">&times;</button>
            <h2 class="text-3xl font-black mb-8 gradient-text">로그인</h2>
            <input type="email" id="loginEmail" placeholder="이메일 주소" class="w-full mb-4 p-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-pink-400 transition">
            <input type="password" id="loginPassword" placeholder="비밀번호" class="w-full mb-8 p-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-pink-400 transition">
            <button onclick="handleLogin()" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-bold text-lg hover:bg-black transition shadow-lg">로그인</button>
            <p class="mt-6 text-center text-gray-500">계정이 없으신가요? <button onclick="openSignupModal(); closeLoginModal();" class="text-pink-500 font-bold underline ml-1">회원가입</button></p>
        </div>
    </div>

    <div id="signupModal" class="modal">
        <div class="bg-white p-10 rounded-3xl w-full max-w-sm relative shadow-2xl border-t-8 border-orange-400">
            <button onclick="closeSignupModal()" class="absolute top-6 right-6 text-gray-400 hover:text-black text-3xl">&times;</button>
            <h2 class="text-3xl font-black mb-2">무료 회원가입</h2>
            <p class="text-gray-400 mb-8 text-sm">PixelArt의 회원이 되어 혜택을 누리세요!</p>
            <input type="text" id="signupName" placeholder="성함" class="w-full mb-4 p-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-orange-400">
            <input type="email" id="signupEmail" placeholder="이메일 주소" class="w-full mb-4 p-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-orange-400">
            <input type="password" id="signupPassword" placeholder="비밀번호 설정" class="w-full mb-8 p-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-orange-400">
            <button onclick="handleSignup()" class="w-full bg-gradient-to-r from-orange-500 to-pink-500 text-white py-4 rounded-2xl font-bold text-lg hover:opacity-90 transition shadow-lg">가입 완료하기</button>
        </div>
    </div>

    <script>
        const galleryData = [
            { id: 1, title: '추상 그라디언트 01', category: 'wallpaper', image: 'https://images.unsplash.com/photo-1514565131-fce0801e5785?w=800' },
            { id: 2, title: '심연의 일러스트', category: 'illustration', image: 'https://images.unsplash.com/photo-1561070791-2526d30994b5?w=800' },
            { id: 3, title: '고요한 산맥', category: 'photo', image: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800' },
            { id: 4, title: '사이버펑크 시티', category: 'wallpaper', image: 'https://images.unsplash.com/photo-1550859492-d5da9d8e45f3?w=800' },
            { id: 5, title: '디지털 캔버스', category: 'illustration', image: 'https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=800' },
            { id: 6, title: '에메랄드 바다', category: 'photo', image: 'https://images.unsplash.com/photo-1505142468610-359e7d316be0?w=800' }
        ];

        let currentUser = JSON.parse(localStorage.getItem('currentUser'));
        let likedItems = currentUser ? JSON.parse(localStorage.getItem('likes_' + currentUser.email)) || [] : [];
        let currentFilter = 'all';

        function init() {
            updateUI();
            renderGallery();
        }

        function updateUI() {
            const authBtns = document.getElementById('authButtons');
            const userMenu = document.getElementById('userMenu');
            const heroSignup = document.getElementById('heroSignupBtn');

            if (currentUser) {
                authBtns.classList.add('hidden');
                userMenu.classList.remove('hidden');
                if(heroSignup) heroSignup.classList.add('hidden');
                document.getElementById('userNameDisplay').innerText = currentUser.name + '님 환영합니다';
                document.getElementById('mpName').innerText = currentUser.name;
                document.getElementById('mpEmail').innerText = currentUser.email;
            } else {
                authBtns.classList.remove('hidden');
                userMenu.classList.add('hidden');
                if(heroSignup) heroSignup.classList.remove('hidden');
            }
        }

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = galleryData.filter(item => {
                const matchesFilter = (currentFilter === 'all' || item.category === currentFilter);
                const matchesSearch = item.title.toLowerCase().includes(search);
                return matchesFilter && matchesSearch;
            });

            grid.innerHTML = filtered.map(item => `
                <div class="gallery-item relative bg-white rounded-[2rem] overflow-hidden shadow-xl hover-scale border border-gray-50">
                    <button onclick="toggleLike(${item.id})" class="like-btn ${likedItems.includes(item.id) ? 'liked' : ''}">
                        ${likedItems.includes(item.id) ? '❤️' : '🤍'}
                    </button>
                    <img src="${item.image}" class="w-full h-72 object-cover">
                    <div class="p-8">
                        <p class="text-xs font-black text-pink-500 uppercase tracking-widest mb-2">${item.category}</p>
                        <h3 class="font-black text-2xl text-gray-800">${item.title}</h3>
                    </div>
                </div>
            `).join('');
        }

        function toggleLike(id) {
            if (!currentUser) {
                alert('로그인이 필요한 기능입니다!');
                openLoginModal();
                return;
            }
            const idx = likedItems.indexOf(id);
            if (idx > -1) likedItems.splice(idx, 1);
            else likedItems.push(id);
            
            localStorage.setItem('likes_' + currentUser.email, JSON.stringify(likedItems));
            renderGallery();
            if(!document.getElementById('mypage').classList.contains('hidden')) updateLikedList();
        }

        function filterGallery(cat, btn) {
            currentFilter = cat;
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('bg-pink-500', 'text-white', 'shadow-md');
                b.classList.add('bg-gray-100');
            });
            btn.classList.add('bg-pink-500', 'text-white', 'shadow-md');
            btn.classList.remove('bg-gray-100');
            renderGallery();
        }

        function searchGallery() { renderGallery(); }

        function showMyPage() {
            document.getElementById('hero').classList.add('hidden');
            document.getElementById('gallery').classList.add('hidden');
            document.getElementById('mypage').classList.remove('hidden');
            window.scrollTo(0, 0);
            updateLikedList();
        }

        function goToHome() {
            document.getElementById('hero').classList.remove('hidden');
            document.getElementById('gallery').classList.remove('hidden');
            document.getElementById('mypage').classList.add('hidden');
        }

        function updateLikedList() {
            const list = document.getElementById('likedList');
            const likedData = galleryData.filter(i => likedItems.includes(i.id));
            if(likedData.length === 0) {
                list.innerHTML = '<p class="text-gray-400 text-sm py-10 col-span-full">아직 찜한 항목이 없습니다.</p>';
                return;
            }
            list.innerHTML = likedData.map(i => `
                <div class="relative group">
                    <img src="${i.image}" class="rounded-2xl h-32 w-full object-cover shadow-md">
                    <div class="absolute inset-0 bg-black bg-opacity-40 opacity-0 group-hover:opacity-100 transition rounded-2xl flex items-center justify-center">
                        <button onclick="toggleLike(${i.id})" class="text-white text-xs font-bold">삭제</button>
                    </div>
                </div>
            `).join('');
        }

        // --- Auth Modals ---
        function openLoginModal() { document.getElementById('loginModal').classList.add('active'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.remove('active'); }
        function openSignupModal() { document.getElementById('signupModal').classList.add('active'); }
        function closeSignupModal() { document.getElementById('signupModal').classList.remove('active'); }

        function handleSignup() {
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            if(!name || !email || !password) return alert('모든 정보를 입력해주세요!');
            
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            if(users.some(u => u.email === email)) return alert('이미 가입된 이메일입니다.');
            
            users.push({name, email, password});
            localStorage.setItem('users', JSON.stringify(users));
            alert('가입을 환영합니다! 이제 로그인을 해주세요.');
            closeSignupModal();
            openLoginModal();
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);
            
            if (user) {
                currentUser = user;
                localStorage.setItem('currentUser', JSON.stringify(user));
                likedItems = JSON.parse(localStorage.getItem('likes_' + email)) || [];
                updateUI();
                closeLoginModal();
                alert(user.name + '님, 반갑습니다!');
                renderGallery();
            } else alert('이메일 또는 비밀번호가 틀렸습니다.');
        }

        function logout() {
            if(confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('currentUser');
                location.reload();
            }
        }

        init();
    </script>
</body>
</html>
