<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixelArt - 프리미엄 디지털 아트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #ec4899 0%, #f97316 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 0, 0, 0.05); }
        
        /* 모달 반응형 수정 */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.85); z-index: 9999; align-items: center; justify-content: center; 
            padding: 15px; 
        }
        .modal.active { display: flex; }
        .modal-content { 
            background: white; width: 100%; max-width: 400px; padding: 30px; 
            border-radius: 24px; position: relative; 
        }

        .like-btn { position: absolute; top: 15px; right: 15px; z-index: 10; background: white; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: none; font-size: 1.5rem; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-slate-50 text-gray-900">
    
    <nav class="fixed w-full z-[100] glass-effect h-16 flex items-center">
        <div class="max-w-7xl mx-auto px-4 w-full flex justify-between items-center">
            <div class="text-xl font-black gradient-text cursor-pointer" onclick="location.reload()">PixelArt</div>
            <div id="authButtons" class="flex gap-2">
                <button onclick="openLoginModal()" class="text-sm font-bold px-3 py-2">로그인</button>
                <button onclick="openSignupModal()" class="bg-pink-500 text-white px-4 py-2 rounded-full text-sm font-bold shadow-md">회원가입</button>
            </div>
            <div id="userMenu" class="hidden flex items-center gap-3">
                <button onclick="showMyPage()" class="text-sm font-bold text-gray-700">마이페이지</button>
                <button onclick="logout()" class="text-[10px] bg-gray-100 px-2 py-1 rounded text-gray-400">로그아웃</button>
            </div>
        </div>
    </nav>

    <section class="pt-32 pb-16 px-6 text-center">
        <h1 class="text-4xl font-black mb-4 leading-tight">디지털 아트<br><span class="gradient-text">새로운 기준</span></h1>
        <p class="text-gray-500 mb-8">지금 가입하고 작품을 찜해보세요!</p>
        <div id="heroButtons" class="flex flex-col gap-3">
            <button onclick="openSignupModal()" id="heroSignupBtn" class="w-full bg-gradient-to-r from-pink-500 to-orange-500 text-white py-4 rounded-2xl font-bold text-lg shadow-xl">1초만에 회원가입</button>
            <button onclick="window.scrollTo(0, 600)" class="w-full bg-white border border-gray-200 py-4 rounded-2xl font-bold">갤러리 구경하기</button>
        </div>
    </section>

    <section id="gallery" class="px-4 py-10">
        <div id="galleryGrid" class="grid grid-cols-1 gap-6">
            </div>
    </section>

    <section id="mypage" class="hidden px-4 py-24">
        <div class="bg-white rounded-3xl p-8 shadow-lg">
            <h2 class="text-2xl font-black mb-6">마이페이지</h2>
            <p id="mpName" class="font-bold text-lg"></p>
            <p id="mpEmail" class="text-gray-500 mb-8"></p>
            <h3 class="font-bold mb-4">내 찜 목록</h3>
            <div id="likedList" class="grid grid-cols-2 gap-2"></div>
            <button onclick="location.reload()" class="w-full mt-8 py-3 text-pink-500 font-bold">메인으로</button>
        </div>
    </section>

    <div id="loginModal" class="modal" onclick="if(event.target==this) closeLoginModal()">
        <div class="modal-content">
            <h2 class="text-2xl font-black mb-6">로그인</h2>
            <input type="email" id="loginEmail" placeholder="이메일" class="w-full mb-4 p-4 bg-gray-100 rounded-xl outline-none">
            <input type="password" id="loginPassword" placeholder="비밀번호" class="w-full mb-6 p-4 bg-gray-100 rounded-xl outline-none">
            <button onclick="handleLogin()" class="w-full bg-black text-white py-4 rounded-xl font-bold">로그인</button>
            <button onclick="closeLoginModal()" class="w-full mt-4 text-gray-400">닫기</button>
        </div>
    </div>

    <div id="signupModal" class="modal" onclick="if(event.target==this) closeSignupModal()">
        <div class="modal-content">
            <h2 class="text-2xl font-black mb-6">회원가입</h2>
            <input type="text" id="signupName" placeholder="이름" class="w-full mb-4 p-4 bg-gray-100 rounded-xl outline-none">
            <input type="email" id="signupEmail" placeholder="이메일" class="w-full mb-4 p-4 bg-gray-100 rounded-xl outline-none">
            <input type="password" id="signupPassword" placeholder="비밀번호" class="w-full mb-6 p-4 bg-gray-100 rounded-xl outline-none">
            <button onclick="handleSignup()" class="w-full bg-pink-500 text-white py-4 rounded-xl font-bold">가입하기</button>
            <button onclick="closeSignupModal()" class="w-full mt-4 text-gray-400">닫기</button>
        </div>
    </div>

    <script>
        const galleryData = [
            { id: 1, title: '아트 01', category: 'wallpaper', image: 'https://images.unsplash.com/photo-1514565131-fce0801e5785?w=600' },
            { id: 2, title: '아트 02', category: 'illustration', image: 'https://images.unsplash.com/photo-1561070791-2526d30994b5?w=600' }
        ];

        let currentUser = JSON.parse(localStorage.getItem('currentUser'));
        let likedItems = currentUser ? JSON.parse(localStorage.getItem('likes_' + currentUser.email)) || [] : [];

        function init() {
            updateUI();
            renderGallery();
        }

        function updateUI() {
            if (currentUser) {
                document.getElementById('authButtons').classList.add('hidden');
                document.getElementById('userMenu').classList.remove('hidden');
                document.getElementById('heroSignupBtn').classList.add('hidden');
                document.getElementById('mpName').innerText = currentUser.name + "님";
                document.getElementById('mpEmail').innerText = currentUser.email;
            }
        }

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = galleryData.map(item => `
                <div class="relative bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100">
                    <button onclick="toggleLike(${item.id})" class="like-btn">
                        ${likedItems.includes(item.id) ? '❤️' : '🤍'}
                    </button>
                    <img src="${item.image}" class="w-full h-64 object-cover">
                    <div class="p-6">
                        <h3 class="font-bold text-lg">${item.title}</h3>
                    </div>
                </div>
            `).join('');
        }

        function toggleLike(id) {
            if (!currentUser) return alert('로그인이 필요합니다!');
            const idx = likedItems.indexOf(id);
            if (idx > -1) likedItems.splice(idx, 1);
            else likedItems.push(id);
            localStorage.setItem('likes_' + currentUser.email, JSON.stringify(likedItems));
            renderGallery();
        }

        function openLoginModal() { document.getElementById('loginModal').classList.add('active'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.remove('active'); }
        function openSignupModal() { document.getElementById('signupModal').classList.add('active'); }
        function closeSignupModal() { document.getElementById('signupModal').classList.remove('active'); }

        function handleSignup() {
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            if(!name || !email || !password) return alert('입력해주세요!');
            
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            users.push({name, email, password});
            localStorage.setItem('users', JSON.stringify(users));
            alert('가입 완료! 로그인하세요.');
            closeSignupModal();
            openLoginModal();
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);
            if (user) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                location.reload();
            } else alert('정보 불일치');
        }

        function showMyPage() {
            document.getElementById('gallery').classList.add('hidden');
            document.querySelector('section').classList.add('hidden');
            document.getElementById('mypage').classList.remove('hidden');
            const likedList = document.getElementById('likedList');
            const likedData = galleryData.filter(i => likedItems.includes(i.id));
            likedList.innerHTML = likedData.map(i => `<img src="${i.image}" class="rounded-xl h-24 w-full object-cover">`).join('');
        }

        function logout() { localStorage.removeItem('currentUser'); location.reload(); }
        init();
    </script>
</body>
</html>
