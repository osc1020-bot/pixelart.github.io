<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelArt - 승철님 서버 연동 완료</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 🔥 이미지(image_608da4.png)에서 확인된 승철님의 실제 설정값입니다.
        const firebaseConfig = {
            apiKey: "AIzaSyBlpa0dgKKd7rL1gF9ChjBYOAH-zKA340g",
            authDomain: "mypixelart-56508.firebaseapp.com",
            projectId: "mypixelart-56508",
            storageBucket: "mypixelart-56508.firebasestorage.app",
            messagingSenderId: "237654735317",
            appId: "1:237654735317:web:3186c72a53b8f24f77255c",
            measurementId: "G-5N47DRWVJG"
        };

        // 초기화
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 버튼 클릭 시 실행될 함수들을 전역(window)에 등록 (이게 없으면 클릭 시 에러남)
        window.openSignup = () => { document.getElementById('signupModal').style.display = 'flex'; };
        window.closeSignup = () => { document.getElementById('signupModal').style.display = 'none'; };
        
        // 회원가입 함수 (비밀번호 6자 이상 필수!)
        window.handleJoin = async () => {
            const email = document.getElementById('s-email').value;
            const pw = document.getElementById('s-pw').value;
            
            if (pw.length < 6) {
                alert("비밀번호는 최소 6자 이상이어야 합니다.");
                return;
            }

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pw);
                await setDoc(doc(db, "users", cred.user.uid), {
                    email: email,
                    joinedAt: new Date()
                });
                alert("🎉 서버 가입 성공! 이제 로그인해 보세요.");
                window.closeSignup();
            } catch (e) {
                alert("❌ 실패: " + e.message);
            }
        };

        // 로그인 상태 체크
        onAuthStateChanged(auth, (user) => {
            const loginBtn = document.getElementById('login-btn');
            if (user) {
                loginBtn.innerHTML = `<span class="text-sm font-bold mr-2">${user.email.split('@')[0]}님</span> 
                                     <button onclick="location.reload()" class="text-xs text-red-500 underline">로그아웃</button>`;
            }
        });
    </script>

    <style>
        * { font-family: 'Noto Sans KR', sans-serif; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-gray-100">

    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex justify-between items-center">
            <h1 class="text-2xl font-black text-pink-500">PixelArt</h1>
            <div id="login-btn">
                <button onclick="openSignup()" class="bg-pink-500 text-white px-5 py-2 rounded-full font-bold">가입하기</button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-6">
        <div class="bg-white rounded-3xl p-8 shadow-xl text-center">
            <h2 class="text-3xl font-black mb-4">서버 연동 테스트 버전</h2>
            <p class="text-gray-500 mb-8">가입 버튼을 눌러 승철님의 Firebase 서버에 데이터를 저장해 보세요.</p>
            <div class="grid grid-cols-2 gap-4">
                <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=500" class="rounded-2xl h-48 w-full object-cover">
                <img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=500" class="rounded-2xl h-48 w-full object-cover">
            </div>
        </div>
    </main>

    <div id="signupModal" class="modal">
        <div class="bg-white p-8 rounded-3xl w-full max-w-sm mx-4">
            <h2 class="text-2xl font-bold mb-6">회원가입</h2>
            <input type="email" id="s-email" placeholder="이메일 (예: test@test.com)" class="w-full border p-4 rounded-xl mb-3 outline-none focus:border-pink-500">
            <input type="password" id="s-pw" placeholder="비밀번호 (6자 이상)" class="w-full border p-4 rounded-xl mb-6 outline-none focus:border-pink-500">
            <div class="flex gap-2">
                <button onclick="closeSignup()" class="flex-1 bg-gray-100 py-4 rounded-xl font-bold">취소</button>
                <button onclick="handleJoin()" class="flex-2 bg-pink-500 text-white py-4 px-8 rounded-xl font-bold">가입</button>
            </div>
        </div>
    </div>

</body>
</html>
