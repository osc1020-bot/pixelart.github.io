<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixelArt - 클라우드 연동 버전</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 🔥 본인의 Firebase 설정값을 여기에 붙여넣으세요!
        const firebaseConfig = {
          apiKey: "AIzaSyBlpa0dgKKd7rL1gF9ChjBYOAH-zKA340g",
          authDomain: "mypixelart-56508.firebaseapp.com",
          projectId: "mypixelart-56508",
          storageBucket: "mypixelart-56508.firebasestorage.app",
          messagingSenderId: "237654735317",
          appId: "1:237654735317:web:3186c72a53b8f24f77255c",
          measurementId: "G-5N47DRWVJG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 전역 변수 설정
        window.auth = auth;
        window.db = db;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.signOut = signOut;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
        window.doc = doc;
        window.updateDoc = updateDoc;
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* (기존 CSS 스타일 유지) */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #ec4899 0%, #f97316 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 0, 0, 0.05); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; align-items: center; justify-content: center; padding: 15px; }
        .modal.active { display: flex; }
        #toast { visibility: hidden; min-width: 250px; background: #333; color: #fff; text-align: center; border-radius: 50px; padding: 16px; position: fixed; z-index: 10000; left: 50%; bottom: 30px; transform: translateX(-50%); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body class="bg-slate-50 text-gray-900">
    <div id="toast">메시지 내용</div>
    
    <nav class="fixed w-full z-[100] glass-effect h-16 flex items-center px-4">
        <div class="max-w-7xl mx-auto w-full flex justify-between items-center">
            <div class="text-xl font-black gradient-text cursor-pointer" onclick="location.reload()">PixelArt</div>
            <div id="authButtons" class="flex gap-2">
                <button onclick="openLoginModal()" class="text-sm font-bold px-3">로그인</button>
                <button onclick="openSignupModal()" class="bg-pink-500 text-white px-4 py-2 rounded-full text-sm font-bold">회원가입</button>
            </div>
            <div id="userMenu" class="hidden flex items-center gap-4">
                <div class="relative cursor-pointer" onclick="showMyPage()">🛒 <span id="cartCount" class="bg-pink-500 text-white text-[10px] rounded-full px-1">0</span></div>
                <button onclick="showMyPage()" class="text-sm font-bold">마이페이지</button>
                <button onclick="handleLogout()" class="text-[10px] text-gray-400">로그아웃</button>
            </div>
        </div>
    </nav>

    <section id="hero-section" class="pt-32 pb-10 text-center px-6">
        <h1 class="text-4xl font-black mb-4">클라우드로 연동되는<br><span class="gradient-text">PixelArt</span></h1>
        <p class="text-gray-500 mb-8">어떤 기기에서도 당신의 찜 목록을 확인하세요.</p>
    </section>

    <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 p-4 max-w-7xl mx-auto"></div>

    <script type="module">
        // --- Firebase 연동 로직 ---
        const galleryData = [
            { id: 1, title: '추상화의 물결', category: 'Abstract', image: 'https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=800' },
            { id: 2, title: '보랏빛 우주', category: 'Space', image: 'https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?w=800' }
            // ... 데이터 추가 가능
        ];

        let userData = { likes: [], cart: [] };

        // 1. 로그인 상태 감지
        window.auth.onAuthStateChanged(async (user) => {
            if (user) {
                const docRef = window.doc(window.db, "users", user.uid);
                const docSnap = await window.getDoc(docRef);
                if (docSnap.exists()) userData = docSnap.data();
                
                document.getElementById('authButtons').classList.add('hidden');
                document.getElementById('userMenu').classList.remove('hidden');
                updateUI();
            } else {
                document.getElementById('authButtons').classList.remove('hidden');
                document.getElementById('userMenu').classList.add('hidden');
            }
            renderGallery();
        });

        // 2. 회원가입
        window.handleSignup = async () => {
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const name = document.getElementById('signupName').value;
            try {
                const res = await window.createUserWithEmailAndPassword(window.auth, email, password);
                await window.setDoc(window.doc(window.db, "users", res.user.uid), {
                    name: name, email: email, likes: [], cart: []
                });
                alert('가입 성공!');
                location.reload();
            } catch (e) { alert(e.message); }
        };

        // 3. 로그인
        window.handleLogin = async () => {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            try {
                await window.signInWithEmailAndPassword(window.auth, email, password);
                location.reload();
            } catch (e) { alert('로그인 실패'); }
        };

        // 4. 데이터 업데이트 (찜하기/장바구니)
        window.toggleLike = async (id) => {
            const user = window.auth.currentUser;
            if (!user) return alert('로그인하세요');
            
            const idx = userData.likes.indexOf(id);
            if (idx > -1) userData.likes.splice(idx, 1);
            else userData.likes.push(id);
            
            await window.updateDoc(window.doc(window.db, "users", user.uid), { likes: userData.likes });
            renderGallery();
        };

        // (나머지 renderGallery, showToast 등은 2단계 함수와 동일하게 구현)
    </script>
</body>
</html>
