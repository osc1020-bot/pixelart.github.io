<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelArt - 클라우드 연동 성공</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // 🔥 승철님의 프로젝트 고유 설정값
        const firebaseConfig = {
            apiKey: "AIzaSyBlpa0dgKKd7rL1gF9ChjBYOAH-zKA340g",
            authDomain: "mypixelart-56508.firebaseapp.com",
            projectId: "mypixelart-56508",
            appId: "1:237654735317:web:3186c72a53b8f24f77255c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // 가입 함수 (전역 등록)
        window.handleJoin = async () => {
            const email = document.getElementById('s-email').value;
            const pw = document.getElementById('s-pw').value;

            if (pw.length < 6) {
                alert("비밀번호는 반드시 6자 이상이어야 합니다!");
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, pw);
                alert("🎉 대성공! 이제 구글 서버에 승철님의 계정이 생성되었습니다.");
                location.reload();
            } catch (e) {
                console.error(e);
                // 엔진 미활성화 시 에러 처리
                alert("아직 서버 엔진이 꺼져있습니다.\n에러: " + e.message);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) document.getElementById('status').innerText = user.email + "님 로그인 중";
        });
    </script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen font-sans">
    <div class="bg-white p-12 rounded-[3rem] shadow-2xl w-full max-w-md text-center border border-gray-100">
        <h1 class="text-4xl font-black text-pink-500 mb-8 italic">PixelArt</h1>
        <p id="status" class="text-gray-400 mb-8 font-medium text-lg">서버 가입 테스트를 진행하세요</p>
        
        <div class="space-y-4">
            <input type="email" id="s-email" placeholder="이메일 주소" class="w-full border-2 p-4 rounded-2xl outline-none focus:border-pink-500 transition-all bg-gray-50">
            <input type="password" id="s-pw" placeholder="비밀번호 (6자 이상)" class="w-full border-2 p-4 rounded-2xl outline-none focus:border-pink-500 transition-all bg-gray-50">
            <button onclick="handleJoin()" class="w-full bg-pink-500 text-white py-5 rounded-2xl font-bold text-xl shadow-lg shadow-pink-200 hover:scale-[1.02] active:scale-95 transition-all">서버에 저장</button>
        </div>
    </div>
</body>
</html>
