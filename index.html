<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelArt - 프리미엄 디지털 아트 마켓플레이스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
        html { scroll-behavior: smooth; }
        .gradient-text { background: linear-gradient(135deg, #ec4899 0%, #f97316 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .glass-effect { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 0, 0, 0.05); }
        .hover-scale { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .hover-scale:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(236, 72, 153, 0.2); }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
        .float-animation { animation: float 4s ease-in-out infinite; }
        .gradient-bg { background: linear-gradient(135deg, #fef3f2 0%, #fff1f2 50%, #fce7f3 100%); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .like-btn { position: absolute; top: 15px; right: 15px; z-index: 10; background: white; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: all 0.2s; }
        .like-btn.liked { color: #ec4899; }
    </style>
</head>
<body class="gradient-bg text-gray-900">
    
    <nav class="fixed w-full z-50 glass-effect">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="text-2xl font-black gradient-text cursor-pointer" onclick="location.href='#'">PixelArt</div>
            <div class="hidden md:flex space-x-8 font-medium">
                <a href="#hero" class="hover:text-pink-500 transition">홈</a>
                <a href="#gallery" class="hover:text-pink-500 transition">갤러리</a>
                <a href="#pricing" class="hover:text-pink-500 transition">가격</a>
            </div>
            <div id="authButtons">
                <button onclick="openLoginModal()" class="bg-gradient-to-r from-pink-500 to-orange-500 text-white px-6 py-2 rounded-full font-bold shadow-lg">로그인</button>
            </div>
            <div id="userMenu" class="hidden flex items-center gap-4">
                <a href="#mypage" onclick="showMyPage()" class="text-gray-700 font-bold hover:text-pink-500">마이페이지</a>
                <span id="userNameDisplay" class="font-bold text-pink-600"></span>
                <button onclick="logout()" class="text-sm bg-gray-200 px-3 py-1 rounded-lg">로그아웃</button>
            </div>
        </div>
    </nav>

    <section id="hero" class="pt-32 pb-20 px-4 text-center relative overflow-hidden">
        <div class="absolute top-0 left-1/4 w-64 h-64 bg-pink-200 rounded-full blur-3xl opacity-50 float-animation"></div>
        <div class="relative z-10">
            <h1 class="text-5xl md:text-7xl font-black mb-6 leading-tight">디지털 아트의<br><span class="gradient-text">새로운 기준</span></h1>
            <p class="text-xl text-gray-600 mb-10">당신의 공간을 채울 고품격 이미지를 만나보세요.</p>
            <button onclick="location.href='#gallery'" class="bg-gray-900 text-white px-10 py-4 rounded-full text-lg font-bold hover:bg-black transition">지금 둘러보기</button>
        </div>
    </section>

    <section id="gallery" class="py-20 bg-white">
        <div class="max-w-7xl mx-auto px-4">
            <h2 class="text-4xl font-black text-center mb-12">프리미엄 갤러리</h2>
            
            <div class="flex justify-center gap-4 mb-8 flex-wrap">
                <button onclick="filterGallery('all')" class="px-6 py-2 rounded-full bg-pink-500 text-white font-bold">전체</button>
                <button onclick="filterGallery('wallpaper')" class="px-6 py-2 rounded-full bg-gray-100 hover:bg-gray-200">배경화면</button>
                <button onclick="filterGallery('illustration')" class="px-6 py-2 rounded-full bg-gray-100 hover:bg-gray-200">일러스트</button>
                <button onclick="filterGallery('photo')" class="px-6 py-2 rounded-full bg-gray-100 hover:bg-gray-200">사진</button>
            </div>

            <div class="max-w-md mx-auto mb-12">
                <input type="text" id="searchInput" onkeyup="searchGallery()" placeholder="이미지 검색..." class="w-full px-5 py-3 rounded-full border-2 border-gray-100 focus:border-pink-500 outline-none">
            </div>

            <div id="galleryGrid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
                </div>
        </div>
    </section>

    <section id="mypage" class="py-20 px-4 hidden">
        <div class="max-w-4xl mx-auto bg-white rounded-3xl p-10 shadow-xl">
            <h2 class="text-3xl font-black mb-8">마이페이지</h2>
            <div class="grid md:grid-cols-2 gap-10">
                <div class="space-y-4">
                    <p class="text-gray-500">계정 정보</p>
                    <p>이름: <span id="mpName" class="font-bold"></span></p>
                    <p>이메일: <span id="mpEmail" class="font-bold"></span></p>
                </div>
                <div>
                    <p class="text-gray-500 mb-4">내가 찜한 이미지</p>
                    <div id="likedList" class="grid grid-cols-2 gap-4"></div>
                </div>
            </div>
        </div>
    </section>

    <div id="loginModal" class="modal">
        <div class="bg-white p-8 rounded-2xl w-full max-w-sm relative">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-2xl">&times;</button>
            <h2 class="text-2xl font-black mb-6">로그인</h2>
            <input type="email" id="loginEmail" placeholder="이메일" class="w-full mb-4 p-3 border rounded-xl outline-none">
            <input type="password" id="loginPassword" placeholder="비밀번호" class="w-full mb-6 p-3 border rounded-xl outline-none">
            <button onclick="handleLogin()" class="w-full bg-pink-500 text-white py-3 rounded-xl font-bold">로그인하기</button>
            <p class="mt-4 text-center text-sm">계정이 없으신가요? <button onclick="openSignupModal(); closeLoginModal();" class="text-pink-500 underline">회원가입</button></p>
        </div>
    </div>

    <div id="signupModal" class="modal">
        <div class="bg-white p-8 rounded-2xl w-full max-w-sm relative">
            <button onclick="closeSignupModal()" class="absolute top-4 right-4 text-2xl">&times;</button>
            <h2 class="text-2xl font-black mb-6">회원가입</h2>
            <input type="text" id="signupName" placeholder="이름" class="w-full mb-4 p-3 border rounded-xl outline-none">
            <input type="email" id="signupEmail" placeholder="이메일" class="w-full mb-4 p-3 border rounded-xl outline-none">
            <input type="password" id="signupPassword" placeholder="비밀번호" class="w-full mb-6 p-3 border rounded-xl outline-none">
            <button onclick="handleSignup()" class="w-full bg-orange-500 text-white py-3 rounded-xl font-bold">가입하기</button>
        </div>
    </div>

    <script>
        const galleryData = [
            { id: 1, title: '추상 그라디언트', category: 'wallpaper', image: 'https://images.unsplash.com/photo-1514565131-fce0801e5785?w=600' },
            { id: 2, title: '우주 일러스트', category: 'illustration', image: 'https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=600' },
            { id: 3, title: '산 풍경', category: 'photo', image: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600' },
            { id: 4, title: '네온 밤', category: 'wallpaper', image: 'https://images.unsplash.com/photo-1550859492-d5da9d8e45f3?w=600' }
        ];

        let currentUser = JSON.parse(localStorage.getItem('currentUser'));
        let likedItems = currentUser ? JSON.parse(localStorage.getItem('likes_' + currentUser.email)) || [] : [];
        let currentFilter = 'all';

        function init() {
            updateUI();
            renderGallery();
        }

        function updateUI() {
            if (currentUser) {
                document.getElementById('authButtons').classList.add('hidden');
                document.getElementById('userMenu').classList.remove('hidden');
                document.getElementById('userNameDisplay').innerText = currentUser.name + '님';
                document.getElementById('mpName').innerText = currentUser.name;
                document.getElementById('mpEmail').innerText = currentUser.email;
            } else {
                document.getElementById('authButtons').classList.remove('hidden');
                document.getElementById('userMenu').classList.add('hidden');
            }
        }

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = galleryData.filter(item => {
                return (currentFilter === 'all' || item.category === currentFilter) && 
                       (item.title.toLowerCase().includes(search));
            });

            grid.innerHTML = filtered.map(item => `
                <div class="gallery-item relative bg-white rounded-2xl overflow-hidden shadow-lg hover-scale">
                    <button onclick="toggleLike(${item.id})" class="like-btn ${likedItems.includes(item.id) ? 'liked' : ''}">
                        ${likedItems.includes(item.id) ? '❤️' : '🤍'}
                    </button>
                    <img src="${item.image}" class="w-full h-64 object-cover">
                    <div class="p-6">
                        <h3 class="font-bold text-lg">${item.title}</h3>
                        <p class="text-sm text-gray-400 uppercase font-bold">${item.category}</p>
                    </div>
                </div>
            `).join('');
        }

        function toggleLike(id) {
            if (!currentUser) return alert('로그인이 필요합니다!');
            const idx = likedItems.indexOf(id);
            if (idx > -1) likedItems.splice(idx, 1);
            else likedItems.push(id);
            localStorage.setItem('likes_' + currentUser.email, JSON.stringify(likedItems));
            renderGallery();
            updateLikedList();
        }

        function filterGallery(cat) {
            currentFilter = cat;
            renderGallery();
        }

        function searchGallery() { renderGallery(); }

        function showMyPage() {
            document.getElementById('hero').classList.add('hidden');
            document.getElementById('gallery').classList.add('hidden');
            document.getElementById('mypage').classList.remove('hidden');
            updateLikedList();
        }

        function updateLikedList() {
            const list = document.getElementById('likedList');
            const likedData = galleryData.filter(i => likedItems.includes(i.id));
            list.innerHTML = likedData.map(i => `<img src="${i.image}" class="rounded-lg h-24 w-full object-cover">`).join('');
        }

        // Auth Logic
        function openLoginModal() { document.getElementById('loginModal').classList.add('active'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.remove('active'); }
        function openSignupModal() { document.getElementById('signupModal').classList.add('active'); }
        function closeSignupModal() { document.getElementById('signupModal').classList.remove('active'); }

        function handleSignup() {
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            if(!name || !email || !password) return alert('모두 입력해주세요.');
            
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            users.push({name, email, password});
            localStorage.setItem('users', JSON.stringify(users));
            alert('가입 완료! 로그인 해주세요.');
            closeSignupModal();
            openLoginModal();
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);
            
            if (user) {
                currentUser = user;
                localStorage.setItem('currentUser', JSON.stringify(user));
                likedItems = JSON.parse(localStorage.getItem('likes_' + email)) || [];
                updateUI();
                closeLoginModal();
                alert('로그인 성공!');
                renderGallery();
            } else alert('정보가 올바르지 않습니다.');
        }

        function logout() {
            localStorage.removeItem('currentUser');
            location.reload();
        }

        init();
    </script>
</body>
</html>
