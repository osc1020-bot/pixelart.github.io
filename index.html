<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelArt - 최종 연동 버전</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 🔥 승철님의 Firebase 공식 설정값입니다. (오타 수정 완료)
        const firebaseConfig = {
            apiKey: "AIzaSyBlpa0dgKKd7rL1gF9ChjBYOAH-zKA340g",
            authDomain: "mypixelart-56508.firebaseapp.com",
            projectId: "mypixelart-56508",
            storageBucket: "mypixelart-56508.firebasestorage.app",
            messagingSenderId: "237654735317",
            appId: "1:237654735317:web:3186c72a53b8f24f77255c",
            measurementId: "G-5N47DRWVJG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // UI 제어 함수
        window.openSignup = () => { document.getElementById('signupModal').style.display = 'flex'; };
        window.closeSignup = () => { document.getElementById('signupModal').style.display = 'none'; };

        // 가입 로직 (비밀번호는 반드시 6자 이상이어야 에러가 안 납니다)
        window.handleJoin = async () => {
            const email = document.getElementById('s-email').value;
            const pw = document.getElementById('s-pw').value;
            const name = document.getElementById('s-name').value;

            if (pw.length < 6) {
                alert("비밀번호를 6자 이상 입력해주세요!");
                return;
            }

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pw);
                // Firestore에 사용자 정보 저장
                await setDoc(doc(db, "users", cred.user.uid), {
                    name: name,
                    email: email,
                    joinedAt: new Date()
                });
                alert("🎉 " + name + "님, 가입이 성공적으로 완료되었습니다!");
                window.closeSignup();
            } catch (e) {
                console.error(e);
                alert("❌ 가입 실패: " + e.message);
            }
        };

        // 로그아웃 함수
        window.handleLogout = () => { signOut(auth).then(() => location.reload()); };

        // 로그인 상태 감지
        onAuthStateChanged(auth, (user) => {
            const btnArea = document.getElementById('auth-buttons');
            if (user) {
                btnArea.innerHTML = `
                    <span class="font-bold text-sm mr-2">${user.email}님</span>
                    <button onclick="handleLogout()" class="text-xs text-red-500">로그아웃</button>
                `;
            }
        });
    </script>

    <style>
        * { font-family: 'Noto Sans KR', sans-serif; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-gray-50">

    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex justify-between items-center">
            <h1 class="text-2xl font-black text-pink-500">PixelArt</h1>
            <div id="auth-buttons">
                <button onclick="openSignup()" class="bg-pink-500 text-white px-6 py-2 rounded-full font-bold">가입하기</button>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-8">
        <div class="bg-white rounded-3xl p-10 shadow-lg text-center">
            <h2 class="text-3xl font-black mb-4">나만의 디지털 갤러리</h2>
            <p class="text-gray-500 mb-10">클라우드 연동으로 어디서나 내 작품을 확인하세요.</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=600" class="rounded-2xl shadow-md">
                <img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=600" class="rounded-2xl shadow-md">
            </div>
        </div>
    </main>

    <div id="signupModal" class="modal">
        <div class="bg-white p-8 rounded-3xl w-full max-w-sm mx-4">
            <h2 class="text-2xl font-bold mb-6 text-center">반가워요!</h2>
            <input type="text" id="s-name" placeholder="이름" class="w-full border p-4 rounded-xl mb-3 outline-none">
            <input type="email" id="s-email" placeholder="이메일 주소" class="w-full border p-4 rounded-xl mb-3 outline-none">
            <input type="password" id="s-pw" placeholder="비밀번호 (6자 이상)" class="w-full border p-4 rounded-xl mb-6 outline-none">
            <div class="flex gap-2">
                <button onclick="closeSignup()" class="flex-1 bg-gray-100 py-4 rounded-xl font-bold">닫기</button>
                <button onclick="handleJoin()" class="flex-2 bg-pink-500 text-white py-4 px-8 rounded-xl font-bold">서버 가입</button>
            </div>
        </div>
    </div>

</body>
</html>
