<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelArt - 연결 성공 버전</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 승철님 프로젝트 고유 설정
        const firebaseConfig = {
            apiKey: "AIzaSyBlpa0dgKKd7rL1gF9ChjBYOAH-zKA340g",
            authDomain: "mypixelart-56508.firebaseapp.com",
            projectId: "mypixelart-56508",
            storageBucket: "mypixelart-56508.firebasestorage.app",
            messagingSenderId: "237654735317",
            appId: "1:237654735317:web:3186c72a53b8f24f77255c",
            measurementId: "G-5N47DRWVJG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.handleJoin = async () => {
            const email = document.getElementById('email').value;
            const pw = document.getElementById('pw').value;
            
            if(pw.length < 6) return alert("비밀번호 6자 이상!");

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pw);
                await setDoc(doc(db, "users", cred.user.uid), { email, joinedAt: new Date() });
                alert("🎉 드디어 성공! 가입되었습니다.");
                location.reload();
            } catch (e) {
                console.error(e);
                alert("에러 내용: " + e.message);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) document.getElementById('status').innerText = user.email + "님 로그인 중";
        });
    </script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-96 text-center">
        <h1 class="text-3xl font-black text-pink-500 mb-6">PixelArt</h1>
        <p id="status" class="mb-4 text-sm text-gray-500">가입 테스트를 진행하세요</p>
        <input type="email" id="email" placeholder="이메일" class="w-full border p-4 rounded-xl mb-3 outline-none">
        <input type="password" id="pw" placeholder="비밀번호(6자이상)" class="w-full border p-4 rounded-xl mb-6 outline-none">
        <button onclick="handleJoin()" class="w-full bg-pink-500 text-white py-4 rounded-xl font-bold shadow-lg">서버 가입 테스트</button>
    </div>
</body>
</html>
