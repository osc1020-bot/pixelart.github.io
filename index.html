<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelArt - 서버 연동 완료</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 🔥 승철님의 이미지(image_608da4.png)를 바탕으로 수정한 정확한 값입니다.
        const firebaseConfig = {
    apiKey: "AIzaSyBlpa0dgKKd7rL1gF9ChjBYOAH-zKA340g",
    authDomain: "mypixelart-56508.firebaseapp.com",
    projectId: "mypixelart-56508",
    storageBucket: "mypixelart-56508.firebasestorage.app",
    messagingSenderId: "237654735317",
    appId: "1:237654735317:web:3186c72a53b8f24f77255c",
    measurementId: "G-5N47DRWVJG"
};
    

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 에러 해결 포인트: 모든 함수를 window 객체에 연결해서 버튼이 인식하게 만듭니다.
        window.openSignupModal = () => document.getElementById('signupModal').style.display = 'flex';
        window.closeSignupModal = () => document.getElementById('signupModal').style.display = 'none';
        window.openLoginModal = () => document.getElementById('loginModal').style.display = 'flex';
        window.closeLoginModal = () => document.getElementById('loginModal').style.display = 'none';

        // 회원가입 로직
        window.handleSignup = async () => {
            const email = document.getElementById('s-email').value;
            const pw = document.getElementById('s-pw').value;
            try {
                const res = await createUserWithEmailAndPassword(auth, email, pw);
                await setDoc(doc(db, "users", res.user.uid), { email: email, createdAt: new Date() });
                alert("🎉 가입 성공! 이제 로그인해 보세요.");
                window.closeSignupModal();
            } catch (e) { alert("에러: " + e.message); }
        };

        // 로그인 로직
        window.handleLogin = async () => {
            const email = document.getElementById('l-email').value;
            const pw = document.getElementById('l-pw').value;
            try {
                await signInWithEmailAndPassword(auth, email, pw);
                alert("반갑습니다!");
                location.reload();
            } catch (e) { alert("로그인 실패: 정보가 틀립니다."); }
        };

        // 로그아웃
        window.handleLogout = () => { signOut(auth).then(() => location.reload()); };

        // 로그인 상태 감지 (네비게이션 변경)
        onAuthStateChanged(auth, (user) => {
            const nav = document.getElementById('nav-right');
            if (user) {
                nav.innerHTML = `<span class="text-sm font-bold mr-4">${user.email}님</span><button onclick="handleLogout()" class="text-xs text-gray-400">로그아웃</button>`;
            }
        });
    </script>

    <style>
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body class="bg-gray-50">

    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex justify-between items-center">
            <h1 class="text-2xl font-black text-pink-500">PixelArt</h1>
            <div id="nav-right">
                <button onclick="openLoginModal()" class="text-sm font-bold px-4">로그인</button>
                <button onclick="openSignupModal()" class="bg-pink-500 text-white px-4 py-2 rounded-full text-sm font-bold">회원가입</button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-10 text-center">
        <h2 class="text-4xl font-black mb-4">내 손안의 디지털 아트</h2>
        <p class="text-gray-500 mb-10">가입하고 나만의 찜 목록을 만드세요.</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=800" class="rounded-3xl shadow-lg">
            <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=800" class="rounded-3xl shadow-lg">
        </div>
    </main>

    <div id="signupModal" class="modal" onclick="if(event.target==this) closeSignupModal()">
        <div class="bg-white p-8 rounded-3xl w-full max-w-sm">
            <h2 class="text-2xl font-bold mb-6">회원가입</h2>
            <input type="email" id="s-email" placeholder="이메일 주소" class="w-full border p-3 rounded-xl mb-3 outline-none focus:border-pink-500">
            <input type="password" id="s-pw" placeholder="비밀번호 (6자 이상)" class="w-full border p-3 rounded-xl mb-6 outline-none focus:border-pink-500">
            <button onclick="handleSignup()" class="w-full bg-pink-500 text-white py-4 rounded-xl font-bold hover:bg-pink-600">서버에 저장하기</button>
        </div>
    </div>

    <div id="loginModal" class="modal" onclick="if(event.target==this) closeLoginModal()">
        <div class="bg-white p-8 rounded-3xl w-full max-w-sm">
            <h2 class="text-2xl font-bold mb-6">로그인</h2>
            <input type="email" id="l-email" placeholder="이메일" class="w-full border p-3 rounded-xl mb-3 outline-none">
            <input type="password" id="l-pw" placeholder="비밀번호" class="w-full border p-3 rounded-xl mb-6 outline-none">
            <button onclick="handleLogin()" class="w-full bg-black text-white py-4 rounded-xl font-bold">접속하기</button>
        </div>
    </div>

</body>
</html>
